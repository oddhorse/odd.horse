# main deploy to hosting server. real bitch to set up.
# methods gleaned from this beautiful post :3
# https://zellwk.com/blog/github-actions-deploy/

on:
  # Runs on pushes targeting the beta branch
  push:
    branches: ['beta']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

    
name: publish to server (beta)
jobs:
  web-deploy:
    name: 🐴 deploy on commit (beta)
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: set up node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm-beta'

    - name: install dependencies
      run: npm ci

    - name: build
      run: npm run build

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_KEY }}
        known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

    - name: add known hosts
      run: ssh-keyscan -H ${{ secrets.SSH_SERVER }} >> ~/.ssh/known_hosts

    - name: Deploy with rsync
      run: rsync -avz ./dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER }}:/home/${{ secrets.SSH_USER }}/beta.odd.horse/