# DigitalOcean infrastructure testing
# Deploy to test location on DigitalOcean droplet
# Test with IP address before switching DNS

on:
  push:
    branches: ['digitalocean']
  workflow_dispatch:

name: deploy to digitalocean (test)
jobs:
  web-deploy:
    name: 🐴 deploy to DO test
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: set up node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: install dependencies
      run: npm ci

    - name: clean dist folder
      run: npm run clean

    - name: build
      run: npm run build

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.DO_SSH_KEY }}
        known_hosts: 'placeholder'

    - name: add known hosts
      run: ssh-keyscan -H ${{ secrets.DO_SERVER_IP }} >> ~/.ssh/known_hosts

    # Deploy static site to test location
    - name: Deploy static site
      run: rsync -avz --delete ./dist/ ${{ secrets.DO_USER }}@${{ secrets.DO_SERVER_IP }}:/var/www/test.odd.horse/

